name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check schemas and compatibility paths
        run: npm run check

      - name: Test the packed public API as a consumer
        run: npm run validate:package

      - name: Verify generated schemas are committed
        run: git diff --exit-code
