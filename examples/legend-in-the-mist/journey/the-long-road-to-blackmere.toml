name = "The Long Road to Blackmere"
type = "landscape"
description = "Four days of drowned road between the last inn and Blackmere, where the water is never quite where it was yesterday. Nothing here hunts the Heroes.\n\nThe marsh simply does not care whether they arrive, and that is the whole of it."
tags = [ "waist-deep in black water", "no landmark in any direction", "the reeds carry sound a long way" ]
benefits = "Anyone who reaches Blackmere on foot is owed a bed and a meal, and the marsh-folk will say so out loud."
general_consequences = [ "The day is gone and the water is rising ({time-passes-1}).", "Give {footsore-2} to whoever set the pace.", "Something in the pack is ruined beyond drying out." ]

[[vignettes]]
name = "The drowned mile"
trigger = "When the Heroes try to cross after dark."
consequences = [ "Give {soaked-1} to whoever went in first.", "The path behind is gone ({lost-2})." ]

[[vignettes]]
name = "A toll at the crossing"
consequences = [ "The ferryman remembers a face and names a price later (**Exposure**).", "Someone takes a share of the supplies (remove a tier from {well-provisioned})." ]

[[vignettes]]
name = "Something keeping pace"
trigger = "The first time the party spends a night without shelter."
consequences = [ "Give {watched-1} to the whole party.", "Whoever kept watch does not sleep ({exhausted-2})." ]

